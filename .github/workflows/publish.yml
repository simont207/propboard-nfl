name: Publish PropBoard

# Rebuilds the site every 3 hours (and whenever the code changes, or when you click "Run workflow").
# The 13:00 UTC run (and any manual "Run workflow" click) also pulls real SportsGameOdds lines — once a
# day keeps it well under the free tier's 2,500-credit/month budget; the other 3-hourly runs stay EST-only.
on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Only set on the once-daily 13:00 UTC run or a manual dispatch — never on every push, or on the
      # 3-hourly runs, which would blow past the free tier's monthly credit budget.
      SGO_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * *') && secrets.SGO_API_KEY || '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # NCAAF box scores are fetched one game at a time (~260 of them) and cached to disk — a completed
      # game's score never changes, so restoring this between runs turns most rebuilds into just fetching
      # the handful of NEW completed games since last time, instead of all of them from scratch.
      - uses: actions/cache@v4
        with:
          path: data/cfb/games
          key: cfb-boxscores-${{ github.run_id }}
          restore-keys: cfb-boxscores-
      # Every run starts from a clean checkout with no data/ at all (it's gitignored, never committed) —
      # without this, the 3-hourly runs that DON'T pull fresh SGO lines would have nothing to fall back
      # to and would rebuild EST-only, wiping out the once-a-day pull until the next 13:00 UTC run. This
      # restores whatever the most recent pull (from any run) wrote, so real lines persist between pulls.
      - uses: actions/cache@v4
        with:
          path: data/sgo_odds.json
          key: sgo-odds-${{ github.run_id }}
          restore-keys: sgo-odds-
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
