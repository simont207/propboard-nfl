name: Publish PropBoard

# Rebuilds the site every 3 hours (and whenever the code changes, or when you click "Run workflow").
on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # After this moment the site is replaced by an "offline" page (checked on each 3-hourly rebuild).
      # Delete this line to keep the site up.
      TAKEDOWN_AT: "2026-09-23T02:30:00Z"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
