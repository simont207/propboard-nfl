name: Publish PropBoard

# Rebuilds the site every 3 hours (and whenever the code changes, or when you click "Run workflow").
on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # NCAAF box scores are fetched one game at a time (~260 of them) and cached to disk — a completed
      # game's score never changes, so restoring this between runs turns most rebuilds into just fetching
      # the handful of NEW completed games since last time, instead of all of them from scratch.
      - uses: actions/cache@v4
        with:
          path: data/cfb/games
          key: cfb-boxscores-${{ github.run_id }}
          restore-keys: cfb-boxscores-
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
