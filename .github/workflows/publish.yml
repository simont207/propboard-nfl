name: Publish PropBoard

# Keeps the data fresh about every 3 hours (and rebuilds whenever the code changes, or when you click
# "Run workflow"). GitHub treats scheduled runs as best effort -- it routinely delays or drops them -- so
# instead of one trigger every 3 hours, a cheap trigger fires every hour and the `check` job below only
# lets a full build start once the live data is at least 2.5 hours old. That lands a build about every 3
# hours when GitHub is healthy, and a dropped trigger is made up for by the next hourly one.
# The 13:00 UTC run (and any manual "Run workflow" click) always builds AND pulls real SportsGameOdds
# lines -- once a day keeps it near the free tier's 2,500-credit/month budget; every other build stays
# on the cached lines and never touches the odds key.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "0 13 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.age.outputs.build }}
    steps:
      - id: age
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/built.json
        run: |
          # Pushes, manual runs and the daily odds run always build. An hourly trigger builds only when
          # the live site's data is stale; if the live age can't be read for any reason, build anyway.
          if [ "$EVENT" != "schedule" ] || [ "$CRON" = "0 13 * * *" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          age=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$URL" 2>/dev/null \
                | python3 -c "import json,sys,time; print(int(time.time() - json.load(sys.stdin)['built']))" 2>/dev/null \
                || echo 999999)
          echo "live data is ${age}s old"
          if [ "$age" -ge 9000 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Fresh enough (under 2.5h) -- skipping this hourly trigger."
          fi

  build-and-deploy:
    needs: check
    # Build unless the check explicitly said not to (so a failed check can never silently stop builds).
    if: ${{ !cancelled() && needs.check.outputs.build != 'false' }}
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      # Only set on the once-daily 13:00 UTC run or a manual dispatch — never on every push, or on the
      # 3-hourly runs, which would blow past the free tier's monthly credit budget.
      SGO_API_KEY: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 13 * * *') && secrets.SGO_API_KEY || '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # NCAAF box scores are fetched one game at a time (~260 of them) and cached to disk — a completed
      # game's score never changes, so restoring this between runs turns most rebuilds into just fetching
      # the handful of NEW completed games since last time, instead of all of them from scratch.
      - uses: actions/cache@v4
        with:
          path: data/cfb/games
          key: cfb-boxscores-${{ github.run_id }}
          restore-keys: cfb-boxscores-
      # Same reasoning as the CFB cache above, but NBA's history is a full prior season (~1,230
      # games) instead of a rolling 6 weeks — the very first run with no cache yet fetches all of
      # it and will be slow; every run after that only fetches whatever's genuinely new (nothing,
      # until the 2026-27 season starts producing its own completed games).
      - uses: actions/cache@v4
        with:
          path: data/nba
          key: nba-boxscores-${{ github.run_id }}
          restore-keys: nba-boxscores-
      # Same reasoning again for NHL's own full prior season (~1,300 games across 32 teams).
      - uses: actions/cache@v4
        with:
          path: data/nhl
          key: nhl-boxscores-${{ github.run_id }}
          restore-keys: nhl-boxscores-
      # Every run starts from a clean checkout with no data/ at all (it's gitignored, never committed) —
      # without this, the 3-hourly runs that DON'T pull fresh SGO lines would have nothing to fall back
      # to and would rebuild EST-only, wiping out the once-a-day pull until the next 13:00 UTC run. This
      # restores whatever the most recent pull (from any run) wrote, so real lines persist between pulls.
      - uses: actions/cache@v4
        with:
          path: data/sgo_odds.json
          key: sgo-odds-${{ github.run_id }}
          restore-keys: sgo-odds-
      # Same reasoning as the SGO odds cache above -- without this every run fetches all ~20 outdoor
      # games' weather from scratch instead of only the ones that changed or are newly in range.
      - uses: actions/cache@v4
        with:
          path: data/weather_cache.json
          key: weather-${{ github.run_id }}
          restore-keys: weather-
      # Real line-movement history: unlike the caches above (which just avoid re-fetching), this one is
      # the ONLY copy of past lines that will ever exist -- SGO's API only ever returns the CURRENT
      # line, never a past one, so if this cache is ever lost, that history is gone for good, not just
      # slow to rebuild.
      - uses: actions/cache@v4
        with:
          path: data/line_history.json
          key: line-history-${{ github.run_id }}
          restore-keys: line-history-
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
